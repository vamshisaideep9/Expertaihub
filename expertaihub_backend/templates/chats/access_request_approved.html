<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Access Granted</title>
    <style>
      body { font-family: sans-serif; max-width: 600px; margin: 2em auto; text-align: center; }
      a.button { display: inline-block; padding: 8px 12px; background: #1a73e8; color: white; text-decoration: none; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>✅ Access Granted</h1>
    <p>
      You’ve approved <strong>{{ requester.get_full_name }}</strong>
      to view the chat:
    </p>
    <blockquote style="font-style: italic;">“{{ session.title }}”</blockquote>
    <p>
      <a href="/chat/{{ session.slug }}/" class="button">
        View the session →
      </a>
    </p>
  </body>
</html>
